    <!-- Aplica o tema salvo (ou o do navegador) antes do React carregar, para não piscar -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem("cupola-summit-tema");
          var escuro = salvo === "dark" || ((!salvo || salvo === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(escuro ? "dark" : "light");
          document.documentElement.style.colorScheme = escuro ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
